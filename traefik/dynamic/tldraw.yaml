http:
  routers:
    tldraw:
      rule: Host(`tldraw.iterando.net`)
      entryPoints:
        - websecure
      service: tldraw
      tls: {}

  services:
    tldraw:
      loadBalancer:
        servers:
          - url: http://tldraw:5858

tls:
  certificates:
    - certFile: /certs/tldraw.iterando.net.crt
      keyFile: /certs/tldraw.iterando.net.key
      stores:
        - default
  options:
    default:
      minVersion: VersionTLS12
